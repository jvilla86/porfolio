<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | José Villa</title>
    <meta name="description" content="{{DESCRIPTION}}">
    
    <!-- Open Graph -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:image" content="https://josevilla.dev/assets/img/default.png">
    <meta property="og:url" content="https://josevilla.dev/blog/{{SLUG}}.html">

    <!-- Marcador dinámico para el Schema.org / GEO -->
    <!-- SCHEMA_JSON_LD -->

    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="blog-post-page">

    <header class="site-header">
        <div class="container" style="max-width: 760px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;">
            <a href="../index.html" class="logo" style="color: #38bdf8; text-decoration: none; font-weight: 600;">← Volver al Portafolio</a>
            <nav>
                <a href="index.html" style="color: #94a3b8; text-decoration: none; font-weight: 500; font-size: 0.95rem; padding: 6px 12px; border-radius: 4px; background-color: #1e293b;">Blog</a>
            </nav>
        </div>
    </header>

    <main class="container post-container">
        <article class="blog-post">
 <body class="blog-post-page">
            <header class="post-header">
                <div class="post-meta" style="margin-bottom: 8px;">
                    <span class="category" style="...">{{CATEGORY}}</span>
                    <time datetime="{{DATE}}" style="...">{{DATE}}</time>
                </div>
                <!-- AQUÍ DEBE ESTAR EL MARCADOR H1 -->
                <h1>{{TITLE}}</h1>
                <p class="lead">{{DESCRIPTION}}</p>
            </header>

            <hr class="divider">

           <section class="post-content">
                {{CONTENT}}
            <div class="support-box" style="margin-top: 30px; padding: 20px; background: #1e293b; border-radius: 8px; border: 1px solid #334155; text-align: center;">
                    <p style="color: #94a3b8; font-size: 0.95rem; margin-bottom: 12px;">¿Te ha resultado útil este artículo?</p>
                    <a href="https://ko-fi.com/jvilla86" class="btn btn-secondary" target="_blank" rel="noopener noreferrer" style="font-size: 0.9rem;">☕ Invítame a un café en Ko-fi</a>
            </div>
         </section>
        </article>
    </main>

    <footer class="site-footer" style="text-align: center; padding: 40px 0; color: #64748b; font-size: 0.9rem;">
        <div class="container">
            <p>&copy; 2026 José Villa. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
